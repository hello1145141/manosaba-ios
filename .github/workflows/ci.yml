name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install libvpx
        run: brew install libvpx

      - name: Build host binaries (Metal4 / Metal3)
        run: |
          set -e
          for g in $(ls games); do
            [ -f "games/$g/game.json" ] || continue
            echo "=== Building host for $g"
            make -C host GAME="$g" dmhost dmhost_m3
          done

      - name: Run host unit tests
        run: make -C host/tests run

      - name: Run python tool tests
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check capstone==5.0.9 numpy==2.4.4
          rc=0
          for t in tools/tests/t_*.py; do
            echo "=== Test $t"
            "$RUNNER_TEMP/venv/bin/python" -I "$t" || rc=1
          done
          exit $rc

      # ================= iOS build section =================
      - name: Build iOS archive
        run: |
          set -e
          cd ios
          # 先确认工程文件存在
          if [ ! -f "manosaba.xcworkspace" ]; then
            echo "ERROR: manosaba.xcworkspace not found in ios folder!"
            exit 1
          fi
          xcodebuild \
            -workspace manosaba.xcworkspace \
            -scheme manosaba \
            -configuration Release \
            -archivePath ./manosaba.xcarchive \
            archive

      - name: Export unsigned IPA
        run: |
          set -e
          cd ios
          if [ ! -f "export.plist" ]; then
            echo "ERROR: export.plist missing inside ios folder!"
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath ./manosaba.xcarchive \
            -exportOptionsPlist ./export.plist \
            -exportPath ../build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: manosaba-unsigned-ipa
          path: build/*.ipa
          retention-days: 90
