name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 只装iOS工程依赖，host相关全部删掉！
      - name: Install libvpx
        run: brew install libvpx

      # ================= iOS build section（只保留这个） =================
      - name: Build iOS archive
        run: |
          set -e
          cd ios
          if [ ! -f "manosaba.xcworkspace" ]; then
            echo "ERROR: manosaba.xcworkspace not found in ios folder!"
            exit 1
          fi
          xcodebuild \
            -workspace manosaba.xcworkspace \
            -scheme manosaba \
            -configuration Release \
            -archivePath ./manosaba.xcarchive \
            archive

      - name: Export unsigned IPA
        run: |
          set -e
          cd ios
          if [ ! -f "export.plist" ]; then
            echo "ERROR: export.plist missing inside ios folder!"
            exit 1
          fi
          xcodebuild \
            -exportArchive \
            -archivePath ./manosaba.xcarchive \
            -exportOptionsPlist ./export.plist \
            -exportPath ../build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: manosaba-unsigned-ipa
          path: build/*.ipa
          retention-days: 90
