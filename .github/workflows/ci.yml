name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
  
      - name: Install dependencies
        run: brew install libvpx ninja cmake
        shell: bash
  
      - name: Build iOS archive
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          cmake -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDM_NVN_M3=1
          ninja -C build-ios
          mkdir -p Payload
          cp -R build-ios/manosaba.app Payload/
          zip -r unsigned.ipa Payload
          rm -rf Payload
        shell: bash
  
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: manosaba-ios-build
          path: unsigned.ipa
