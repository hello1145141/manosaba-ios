name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 只装iOS工程依赖，host相关全部删掉！
      - name: Install libvpx
        run: brew install libvpx

      # ================= iOS build section（只保留这个） =================
      - name: Build iOS archive
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          cmake -B build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDM_NVN_M3=1
          ninja -C build-ios
          mkdir -p Payload
          cp -R build-ios/manosaba.app Payload/
          zip -r unsigned.ipa Payload
          rm -rf Payload
        shell: bash

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: manosaba-unsigned-ipa
          path: build/*.ipa
          retention-days: 90
